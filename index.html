<!-- ══════════════════════════════════════════════════
     CONTENT FRAME  (study pages load here)
══════════════════════════════════════════════════ -->
<div class="frame-shell">
  <iframe class="content-frame" id="content-frame"
          title="Study plan content"></iframe>
</div>


<!-- ══════════════════════════════════════════════════
     SCRIPTS
══════════════════════════════════════════════════ -->
<script>
  /* ── DOM refs — all declared first so every function below can use them ── */
  const tabs       = document.querySelectorAll('.nav-tab');
  const frame      = document.getElementById('content-frame');
  const themeBtn   = document.getElementById('theme-toggle');
  const hamburger  = document.getElementById('nav-hamburger');
  const navTabs    = document.getElementById('nav-tabs');
  const arrowLeft  = document.getElementById('nav-arrow-left');
  const arrowRight = document.getElementById('nav-arrow-right');

  /* ────────────────────────────────────────────────────
     NAV SCROLL ARROWS (desktop)
  ──────────────────────────────────────────────────── */
  function updateArrows() {
    if (!arrowLeft || !arrowRight) return;
    const atStart = navTabs.scrollLeft <= 1;
    const atEnd   = navTabs.scrollLeft >= navTabs.scrollWidth - navTabs.clientWidth - 1;
    arrowLeft.classList.toggle('arrow-dim', atStart);
    arrowRight.classList.toggle('arrow-dim', atEnd);
  }

  if (arrowLeft)  arrowLeft.addEventListener('click',  () => { navTabs.scrollBy({ left: -220, behavior: 'smooth' }); });
  if (arrowRight) arrowRight.addEventListener('click', () => { navTabs.scrollBy({ left:  220, behavior: 'smooth' }); });
  navTabs.addEventListener('scroll', updateArrows);
  /* Defer until after layout paint so scrollWidth is accurate */
  setTimeout(updateArrows, 0);

  /* ────────────────────────────────────────────────────
     HAMBURGER MENU
  ──────────────────────────────────────────────────── */
  function closeMenu() {
    navTabs.classList.remove('open');
    hamburger.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
  }

  hamburger.addEventListener('click', function(e) {
    e.stopPropagation();
    const isOpen = navTabs.classList.contains('open');
    navTabs.classList.toggle('open', !isOpen);
    hamburger.classList.toggle('open', !isOpen);
    hamburger.setAttribute('aria-expanded', String(!isOpen));
  });

  document.addEventListener('click', function(e) {
    if (!hamburger.contains(e.target) && !navTabs.contains(e.target)) {
      closeMenu();
    }
  });

  /* ────────────────────────────────────────────────────
     TAB SWITCHING
  ──────────────────────────────────────────────────── */
  function activateTab(tab) {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    frame.src = tab.dataset.src;
    document.title = 'DayDeck — ' + tab.textContent.trim();
    closeMenu();
  }

  navTabs.addEventListener('click', function(e) {
    const tab = e.target.closest('.nav-tab');
    if (!tab) return;
    e.preventDefault();
    activateTab(tab);
  });

  activateTab(tabs[0]);

  /* ────────────────────────────────────────────────────
     THEME — push into the iframe on load and on toggle
  ──────────────────────────────────────────────────── */
  function pushThemeToFrame() {
    const theme = localStorage.getItem('daydeck-theme') || 'dark';
    try { frame.contentWindow.postMessage({ type: 'daydeck-theme', theme: theme }, '*'); }
    catch(e) {}
  }

  frame.addEventListener('load', pushThemeToFrame);

  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      themeBtn.textContent = '🌙';
      themeBtn.title = 'Switch to dark mode';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = '☀️';
      themeBtn.title = 'Switch to light mode';
    }
    pushThemeToFrame();
  }

  applyTheme(localStorage.getItem('daydeck-theme') || 'dark');

  themeBtn.addEventListener('click', function() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';
    localStorage.setItem('daydeck-theme', next);
    applyTheme(next);
  });
</script>
